# Ruff style: Compliant
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Core Project Metadata ---
[project]
name = "opym"
version = "0.5.0"
description = "OPM processing library: deskew/decon, stream receiver, backfill, live view, and the shared contracts its consumers import."
readme = "README.md"
license = { file = "LICENSE" }

requires-python = ">=3.10"
authors = [
    { name = "Brandon Scott", email = "brandon.scott@sdsmt.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

# Keywords for discoverability on PyPI
keywords = [
    "microscopy",
    "opm",
    "llsm",
    "bioimaging",
    "image-processing",
    "tiff",
    "zarr",
    "pypetakit",
]

# Light base (docs/adr/0001-light-base.md): numpy only, so the contract modules import in any
# runtime (ChimeraX, pvpython, the rig PC, a viewer) with no heavy stack. Everything else is an extra.
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# Stream wire client/receiver pieces (protocol packing, zmq transport, zarr store reads).
# Install with `uv pip install opym[stream]`.
stream = [
    "msgpack",
    "pyzmq",
    # 2.18.3 is the last zarr 2 for Python 3.10, and it imports numcodecs.blosc.cbuffer_sizes, which
    # numcodecs 0.16 removed; without the split the lock pairs it with numcodecs 0.16 on 3.11+.
    # 2.18.7 caps numcodecs itself.
    "zarr<3; python_version < '3.11'",
    "zarr>=2.18.7,<3; python_version >= '3.11'",
    "numcodecs",
]

# Everything the processing server runs (bioimaging): a superset of the base list before the
# light-base split, plus scipy (imported in 4 files, was undeclared) and numcodecs.
# Install with `uv pip install opym[server]`.
server = [
    "tifffile",
    "zarr<3; python_version < '3.11'",
    "zarr>=2.18.7,<3; python_version >= '3.11'",
    "numcodecs",
    "tqdm",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "PyPetaKit5D",
    "imagecodecs",
    "pyyaml",
    "pyzmq",
    "msgpack",
    # OME-XML for the processed OME-Zarr (ome_zarr_writer.create_processed_store).
    "ome-types>=0.6",
]

# Dependencies for the optional Jupyter viewers
# Install with `uv pip install -e .[viewer]`
viewer = [
    "ipywidgets",
    "matplotlib",
    "ipyfilechooser",
    "ipython",
]

# server + viewer
all = [
    "opym[server,viewer]",
]

# Install with `uv pip install -e .[dev]`
dev = [
    "bandit",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

# --- Entry Points & URLs ---
[project.scripts]
opym = "opym.cli:main"
opym-add-times = "opym.add_times:main"

# URLs for the PyPI sidebar
[project.urls]
Homepage = "https://github.com/bscott711/opym" # Example URL
Repository = "https://github.com/bscott711/opym" # Example URL
Bug-Tracker = "https://github.com/bscott711/opym/issues" # Example URL

# --- Tool Configuration ---
[tool.hatch.build.targets.wheel]
packages = ["src/opym"]

[tool.pytest.ini_options]
# A bare `pytest` at the repo root must not collect stray root scripts.
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
